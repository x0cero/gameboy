[package]
name = "gameboy"
version = "1.0.0"
edition = "2024"

[lib]
name = "gameboy"
path = "src/lib.rs"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "gameboy"
path = "src/main.rs"

[dependencies]
bincode = { version = "2", features = ["derive"] }

# Desktop frontend only: neither of these builds for wasm32.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
cpal = "0.18.1"
minifb = "0.28.0"

# Browser frontend only.
[target.'cfg(target_arch = "wasm32")'.dependencies]
js-sys = "0.3"
wasm-bindgen = "0.2"
